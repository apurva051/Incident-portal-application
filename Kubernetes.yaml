apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-portal
  template:
    metadata:
      labels:
        app: incident-portal
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: incident-portal
          image: 401780891012.dkr.ecr.ap-south-1.amazonaws.com/incident-portal:4
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: incident-portal-service
spec:
  type: NodePort
  selector:
    app: incident-portal
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
